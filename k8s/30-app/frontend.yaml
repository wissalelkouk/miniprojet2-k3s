apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: todo
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
      }
      location /api/ {
        proxy_pass http://api-svc:3000/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels: { app: todo, tier: frontend }
  template:
    metadata:
      labels: { app: todo, tier: frontend }
    spec:
      containers:
        - name: nginx
          image: wissl/todo-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: todo
spec:
  selector: { app: todo, tier: frontend }
  ports:
    - port: 8080
      targetPort: 8080
